[tool.ruff]
line-length = 80
indent-width = 4
output-format = "grouped"
show-fixes = true
target-version = "py312"
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = [
    "F",
    "C90",
    "I",
    "N",
    "UP",
    "E",
    "W",
    "C4",
    "S",
    "B"
]
ignore = ["E501", "S602", "S603", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 80